<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenOffice - AI 文档编辑器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">G</span><span><strong>GenOffice</strong><small>AI 文档编辑器</small></span></div>
    <div class="topbar-spacer"></div>
    <div id="saveState" class="status-chip" role="status" aria-live="polite">已保存到本地</div>
    <div class="topbar-actions">
      <button id="aiSettings" class="secondary">AI 设置</button>
      <button id="exportDocx" class="secondary">导出 Word</button>
      <button id="newProject" class="primary">+ 新建文档</button>
    </div>
  </header>
  <main class="layout">
    <aside class="sidebar"><div class="sidebar-heading"><div><div class="eyebrow">文档空间</div><h2>我的文档</h2></div><span id="projectCount" class="project-count">0</span></div><div class="sidebar-actions"><button id="importProject" class="import-button"><span aria-hidden="true">↑</span> 导入 Word / Markdown</button><input id="fileInput" type="file" accept=".md,.markdown,.txt,.docx,text/markdown,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden></div><div id="importState" class="import-state" aria-live="polite"></div><div id="projectList" class="project-list"></div><div class="sidebar-foot"><span class="foot-mark">●</span> 文档保存在当前设备<br><span>每次修改都会保留历史版本</span></div></aside>
    <section class="editor-shell"><div class="workspace-intro"><strong>写作、润色与导出，在这里一次完成</strong><span>输入内容后，可用右侧 AI 助手优化全文或选中的段落。</span></div><div class="editor-canvas"><div class="doc-head"><div class="doc-title-row"><input id="title" aria-label="文档标题" placeholder="输入文档标题"><div class="editor-tools"><button id="undoEdit" class="tool-button" type="button" aria-label="撤销" title="撤销">↶</button><button id="redoEdit" class="tool-button" type="button" aria-label="重做" title="重做">↷</button></div></div><div class="doc-meta" id="updatedAt"></div></div><textarea id="editor" spellcheck="false" aria-label="文档正文" placeholder="从这里开始写作..."></textarea><div class="editor-foot"><span>Markdown 编辑</span><span id="selectionState" class="selection-state">未选择文字</span><span id="wordCount">0 字</span></div></div></section>
    <aside class="ai-panel"><div class="panel-head"><div><div class="eyebrow">AI 助手</div><h2>帮你处理这篇文档</h2></div><span id="providerStatus" class="status-dot">● 本地模式</span></div><p class="panel-guide">选中文字时只处理选中段落；未选择时处理整篇文档。AI 修改会先展示差异，由你确认后才会应用。</p><div id="providerMeta" class="provider-meta"></div><div class="task-grid"><button data-task="请润色这段内容，使表达更清晰、结构更流畅"><span class="task-icon">Aa</span><span><strong>润色文字</strong><small>改善表达与结构</small></span><span class="task-arrow">→</span></button><button data-task="请将内容总结为三个简洁的要点"><span class="task-icon">≡</span><span><strong>总结要点</strong><small>提炼为三个重点</small></span><span class="task-arrow">→</span></button><button data-task="请根据现有内容续写一个实用的下一节"><span class="task-icon">+</span><span><strong>续写内容</strong><small>补充下一段内容</small></span><span class="task-arrow">→</span></button></div><div id="aiResult" class="ai-result hidden"></div><div class="history"><div class="section-label">历史版本</div><div id="historyList"></div></div></aside>
  </main>
  <dialog id="aiSettingsDialog"><form id="aiSettingsForm" method="dialog"><div class="dialog-head"><div><div class="eyebrow">AI 配置</div><h2>选择 AI 服务</h2></div><button id="closeAiSettings" class="icon-button" type="button" aria-label="关闭">×</button></div><label>服务类型<select id="aiProvider"><option value="local">本地演示模式</option><option value="openai-compatible">OpenAI 兼容服务</option></select></label><label>接口地址<input id="aiBaseUrl" type="url" placeholder="https://api.openai.com/v1"></label><label>模型<input id="aiModel" type="text" placeholder="gpt-4o-mini"></label><p class="dialog-note">API 密钥只从服务端环境变量 <code>GENOFFICE_AI_API_KEY</code> 读取，不会保存在浏览器中。</p><div id="aiSettingsState" class="dialog-state" role="status" aria-live="polite"></div><div class="dialog-actions"><button id="cancelAiSettings" class="secondary" type="button">取消</button><button class="primary" type="submit">保存设置</button></div></form></dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
